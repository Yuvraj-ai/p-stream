name: p-stream

services:
  # CORS + m3u8 proxy — required. Scrapes and header-locked streams go
  # through it, so it must be reachable from your LAN devices on :8081.
  proxy:
    build: ./deploy/simple-proxy
    image: p-stream-proxy:local
    container_name: p-stream-proxy
    restart: unless-stopped
    ports:
      - "8081:8081"

  # p-stream web frontend (nginx, serves dist/)
  p-stream:
    build:
      context: .
      dockerfile: Dockerfile
    image: p-stream-web:local
    container_name: p-stream-web
    restart: unless-stopped
    depends_on:
      - proxy
    ports:
      - "8080:80"
    volumes:
      # runtime configuration (TMDB key, proxy URLs) — edit without rebuilding
      - ./deploy/runtime-config.js:/usr/share/nginx/html/config.js:ro
