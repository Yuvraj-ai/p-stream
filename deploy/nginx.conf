# p-stream web frontend — listens on 8080 so docker-compose port mapping
# "8080:8080" works unchanged and host-network runs match the docs.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # runtime config injected at container start; never cache it
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # hashed Vite assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (hash router still needs index.html for unknown paths)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
